version: '3.8'

services:
  koha_db:
    image: mariadb:10.11
    container_name: koha_db
    environment:
      MARIADB_ROOT_PASSWORD: root_password_easy_test
      MARIADB_USER: koha_library
      MARIADB_PASSWORD: koha_password_123
      MARIADB_DATABASE: koha_library
    volumes:
      - koha_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - koha_network

  koha_app:
    build: .
    container_name: koha_app
    restart: always
    ports:
      - "8081:80"     # OPAC
      - "8082:8080"   # Intranet/Admin
    environment:
      - KOHA_INSTANCE=library
      - KOHA_ADMINUSER=admin
      - KOHA_ADMINPASS=koha_123
      - KOHA_DBHOST=koha_db
      - KOHA_DBNAME=koha_library
      - KOHA_DBUSER=koha_library
      - KOHA_DBPASS=koha_123
      # Esta línea es vital para que no dé el error 500 al inicio
      - KOHA_CONF=/etc/koha/sites/library/koha-conf.xml 
    volumes:
      - koha_app_sites:/etc/koha/sites
      - koha_app_var:/var/lib/koha
    depends_on:
      - koha_db
    networks:
      - koha_network

volumes:
  koha_db_data:
  koha_app_sites:
  koha_app_var:

networks:
  koha_network:
    driver: bridge